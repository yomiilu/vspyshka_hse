<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вспышка</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #app {
    width: 100%;
    height: 100%;
  }
  iframe {
    border: none;
    width: 100%;
    height: 100%;
    display: block;
  }
  .loader {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Montserrat', sans-serif;
    color: #211a17;
    background: #FBF4E4;
  }
  .loader span {
    opacity: 0.6;
    font-size: 14px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
</head>
<body>

<div id="app">
  <div class="loader"><span>Загрузка...</span></div>
</div>

<script>
(function() {
  // 👇 Сохраняем параметры из URL
  const params = new URLSearchParams(window.location.search);
  const page = params.get('page');
  const id = params.get('id');
  
  // Собираем строку параметров для iframe
  let queryString = '';
  if (page) {
    queryString += '?page=' + page;
    if (id) {
      queryString += '&id=' + id;
    }
  }

  const isMobile = window.innerWidth < 960;
  const pageFile = isMobile ? 'index-mobile.html' : 'index-desktop.html';
  
  // Добавляем параметры к URL
  const finalUrl = pageFile + queryString;
  
  const app = document.getElementById('app');
  const iframe = document.createElement('iframe');
  iframe.src = finalUrl;
  iframe.setAttribute('loading', 'eager');
  
  app.innerHTML = '';
  app.appendChild(iframe);
  
  let timeoutId = null;
  window.addEventListener('resize', function() {
    clearTimeout(timeoutId);
    timeoutId = setTimeout(function() {
      const nowMobile = window.innerWidth < 960;
      if (nowMobile !== isMobile) {
        // При перезагрузке сохраняем параметры
        const currentParams = new URLSearchParams(window.location.search);
        const currentPage = currentParams.get('page');
        const currentId = currentParams.get('id');
        let reloadUrl = window.location.pathname;
        if (currentPage) {
          reloadUrl += '?page=' + currentPage;
          if (currentId) reloadUrl += '&id=' + currentId;
        }
        window.location.href = reloadUrl;
      }
    }, 300);
  });
})();
</script>

</body>
</html>
